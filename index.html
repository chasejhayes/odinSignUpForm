<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="javascript.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<!-- 
 make form elements
 style form - make sure to include faint drop shadow
 style button
 style log in alternative-->



<body>
    <div id="container">
        <div id="left_side">
            <div id="test">
                <img src="halie-west-25xggax4bSA-unsplash.jpg" id="filler_photo">
                <div id="logo">
                    <img src="odin-lined.png" id="logo_photo">
                    <div id="brand_name">MOO</div>
                </div>
            </div>
            <p id="credit">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a
                    href="https://unsplash.com/">Unsplash</a></p>
        </div>
        <div id="right_side">
            <div id="call_to_action">
                <div class="text">This is not a real online service! You know you need something like this in your
                    life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</div>
                <div class="text">You <em>know</em> you want to.</div>
            </div>
            <div id="form">
                <h1>Let's do this!</h1>
                <form id="form_elements" action="example.com/path" method="post">
                    <div class="form_div">
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name" name="first_name">
                        <label for="last_name">LAST NAME</label>
                        <input type="text" id="last_name" name="last_name">
                    </div>
                    <div class="form_div">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email">
                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="number" id="phone_number" name="phone_number">
                    </div>
                    <div class="form_div">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password">
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm_password" name="confirm_password">
                    </div>
                </form>
            </div>
            <div id="bottom_info">
                <button>Create Account</button>
                <div id="log_in">
                    <p>Already have an account</p>
                    <button>Log in</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
